<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Notifications</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        #input-container {
            max-width: 400px;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }

        #message {
            flex-grow: 1;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #2ed573;
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1aa34a;
        }

        #notifications {
            max-width: 400px;
            margin: 20px auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 10px 15px;
            transition: all 0.3s ease;
            border-left: 6px solid #2ed573;
            position: relative;
        }

        .notification:hover {
            background: #f1f9ff;
        }

        .icon {
            color: #2ed573;
            font-size: 24px;
            margin-right: 10px;
        }

        .notification-content {
            flex-grow: 1;
        }

        .notification-content p {
            margin: 0;
            font-size: 14px;
        }

        .time {
            font-size: 12px;
            color: #666;
            position: absolute;
            bottom: 10px;
            right: 15px;
        }
    </style>
</head>
<body>
<h1>Real-Time Admin</h1>
<div id="input-container">
    <label for="message"></label><input id="message" placeholder="Enter your message" type="text">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    /**
     * @type {Stomp.Client | null}
     * Holds the STOMP client instance for managing WebSocket connections.
     */
    let stompClient = null;

    /**
     * Establishes a WebSocket connection using SockJS and STOMP, and subscribes to a topic for receiving notifications.
     */
    function connect() {
        // Create a SockJS connection to the server WebSocket endpoint
        const socket = new SockJS('http://localhost:8080/ws');

        // Create a STOMP client over the SockJS connection
        stompClient = Stomp.over(socket);

        /**
         * Connect the STOMP client to the server.
         * @param {Object} headers - Optional headers for the connection.
         * @param {Function} onConnect - Callback function for a successful connection.
         * @param {Function} onError - Callback function for connection errors.
         */
        stompClient.connect({},
            /**
             * Callback executed upon successful connection.
             * @param {string} frame - Connection frame details.
             */
            function (frame) {
                console.log('Connected: ' + frame);

                /**
                 * Subscribe to the '/topic/notifications' topic to listen for messages.
                 * @param {string} destination - The topic to subscribe to.
                 * @param {Function} callback - Function to process received messages.
                 */
                stompClient.subscribe('/topic/notifications',
                    /**
                     * Processes received messages and displays them.
                     * @param {Object} message - The received message.
                     */
                    function (message) {
                        showNotification(message.body);
                    }
                );
            },
            /**
             * Callback executed if the connection fails.
             * @param {string} error - The error message or object.
             */
            function (error) {
                console.error('WebSocket connection error: ' + error);
            }
        );
    }

    /**
     * Sends a message to the server through the WebSocket connection.
     */
    function sendMessage() {
        // Get the message content from the input field
        const message = document.getElementById('message').value;

        if (stompClient && stompClient.connected) {
            /**
             * Sends a message to the server.
             * @param {string} destination - The endpoint to send the message to.
             * @param {Object} headers - Optional headers for the message.
             * @param {string} body - The message body to send.
             */
            stompClient.send('/app/sendMessage', {}, message);
            console.log('Message sent:', message);
        } else {
            console.error('WebSocket connection is not established.');
        }
    }

    // Automatically connect when the script is executed
    connect();

</script>
</body>
</html>
